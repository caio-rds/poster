[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zion-posts"
version = "0.1.0"
description = "API e worker de conteúdo da Zion Software House"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pymongo>=4.13,<5",
  "pydantic-settings>=2.8,<3",
  "openai>=2,<3",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5",
  "a2wsgi>=1.10,<2",
  "pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

